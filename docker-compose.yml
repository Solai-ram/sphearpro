version: '3.8'

services:
  # PostgreSQL Database — do not publish ports on production hosts
  postgres:
    image: postgres:16-alpine
    container_name: hislite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hislite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hislite_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hislite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hislite} -d ${POSTGRES_DB:-hislite}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hislite-network

  # Redis for BullMQ and session caching — set requirepass in production
  redis:
    image: redis:7-alpine
    container_name: hislite-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hislite-network

  # MinIO (S3-compatible) for file storage
  minio:
    image: minio/minio:latest
    container_name: hislite-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hislite-network

  # Mailpit for email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: hislite-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      - hislite-network

  # API Application
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: hislite-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-hislite}:${POSTGRES_PASSWORD:-hislite_dev_password}@postgres:5432/${POSTGRES_DB:-hislite}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-hislite-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASS: ""
      MAIL_FROM: ${MAIL_FROM:-noreply@hislite.local}
      FRONTEND_URL: http://localhost:3000
      PORT: ${API_PORT:-4000}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hislite-network
    command: npm run start:dev

  # Frontend Application (React)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: hislite-web
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:4000
      PORT: ${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - ./packages:/app/packages
    depends_on:
      - api
    networks:
      - hislite-network
    command: npm run dev -- --host 0.0.0.0

  # Prisma Studio (optional, for DB inspection)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.prisma-studio
    container_name: hislite-prisma-studio
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hislite}:${POSTGRES_PASSWORD:-hislite_dev_password}@postgres:5432/${POSTGRES_DB:-hislite}?schema=public
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hislite-network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  hislite-network:
    driver: bridge