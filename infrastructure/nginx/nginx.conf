worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    upstream hislite_api {
        server api:4000;
        keepalive 32;
    }

    upstream hislite_web {
        server web:80;
        keepalive 16;
    }

    # HTTP → ACME + redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name sphearpro.tech www.sphearpro.tech api.sphearpro.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Clinic SPA (+ /platform admin) — relative /api/* → Nest /api/v1/*
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name sphearpro.tech www.sphearpro.tech;

        ssl_certificate     /etc/letsencrypt/live/sphearpro.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sphearpro.tech/privkey.pem;
        include /etc/nginx/snippets/ssl-params.conf;
        include /etc/nginx/snippets/security-headers.conf;

        location /api/ {
            proxy_pass http://hislite_api/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location / {
            proxy_pass http://hislite_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }

    # Public API + Razorpay webhooks
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.sphearpro.tech;

        ssl_certificate     /etc/letsencrypt/live/api.sphearpro.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.sphearpro.tech/privkey.pem;
        include /etc/nginx/snippets/ssl-params.conf;
        include /etc/nginx/snippets/security-headers.conf;

        location / {
            proxy_pass http://hislite_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
