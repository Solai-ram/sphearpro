# =============================================================================
# HIS-Lite — PRODUCTION Docker Compose
# Do NOT replace docker-compose.yml (dev). Use:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# =============================================================================

name: hislite-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hislite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-hislite}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - hislite-network
    # No host ports — internal only

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hislite-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 20s
    networks:
      - hislite-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET:-hislite-documents};
      mc anonymous set none local/$${S3_BUCKET:-hislite-documents};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-hislite-documents}
    networks:
      - hislite-network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    image: hislite-api:prod
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-hislite-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      FRONTEND_URL: ${FRONTEND_URL:-https://sphearpro.tech}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sphearpro.tech,http://sphearpro.tech,https://www.sphearpro.tech,http://www.sphearpro.tech}
      API_URL: ${API_URL:-https://api.sphearpro.tech}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      SUBSCRIPTION_ENFORCE: ${SUBSCRIPTION_ENFORCE:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_ID: ${RAZORPAY_PLAN_ID:-}
      RAZORPAY_MONTHLY_PLAN_ID: ${RAZORPAY_MONTHLY_PLAN_ID:-}
      RAZORPAY_YEARLY_PLAN_ID: ${RAZORPAY_YEARLY_PLAN_ID:-}
      RAZORPAY_PLAN_ID_YEARLY: ${RAZORPAY_PLAN_ID_YEARLY:-}
      RAZORPAY_TRIAL_DAYS: ${RAZORPAY_TRIAL_DAYS:-7}
      RAZORPAY_SUBSCRIPTION_TOTAL_COUNT: ${RAZORPAY_SUBSCRIPTION_TOTAL_COUNT:-120}
      RAZORPAY_SUBSCRIPTION_TOTAL_COUNT_YEARLY: ${RAZORPAY_SUBSCRIPTION_TOTAL_COUNT_YEARLY:-10}
      ALLOW_MANUAL_SUBSCRIPTION_ACTIVATE: ${ALLOW_MANUAL_SUBSCRIPTION_ACTIVATE:-false}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-5}
      SUBSCRIPTION_CURRENCY: ${SUBSCRIPTION_CURRENCY:-INR}
      SAAS_DEFAULT_PLAN_CODE: ${SAAS_DEFAULT_PLAN_CODE:-STANDARD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hislite-network
    # No public ports — nginx only

  # Second NestJS process for BullMQ capacity (same image; processors are idempotent by jobId)
  worker:
    image: hislite-api:prod
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-hislite-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      FRONTEND_URL: ${FRONTEND_URL:-https://sphearpro.tech}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sphearpro.tech,http://sphearpro.tech,https://www.sphearpro.tech,http://www.sphearpro.tech}
      OPENAPI_ENABLED: "false"
      SUBSCRIPTION_ENFORCE: ${SUBSCRIPTION_ENFORCE:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_ID: ${RAZORPAY_PLAN_ID:-}
      RAZORPAY_MONTHLY_PLAN_ID: ${RAZORPAY_MONTHLY_PLAN_ID:-}
      RAZORPAY_YEARLY_PLAN_ID: ${RAZORPAY_YEARLY_PLAN_ID:-}
      RAZORPAY_PLAN_ID_YEARLY: ${RAZORPAY_PLAN_ID_YEARLY:-}
      RAZORPAY_TRIAL_DAYS: ${RAZORPAY_TRIAL_DAYS:-7}
      RAZORPAY_SUBSCRIPTION_TOTAL_COUNT: ${RAZORPAY_SUBSCRIPTION_TOTAL_COUNT:-120}
      RAZORPAY_SUBSCRIPTION_TOTAL_COUNT_YEARLY: ${RAZORPAY_SUBSCRIPTION_TOTAL_COUNT_YEARLY:-10}
      ALLOW_MANUAL_SUBSCRIPTION_ACTIVATE: ${ALLOW_MANUAL_SUBSCRIPTION_ACTIVATE:-false}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-5}
      SUBSCRIPTION_CURRENCY: ${SUBSCRIPTION_CURRENCY:-INR}
      SAAS_DEFAULT_PLAN_CODE: ${SAAS_DEFAULT_PLAN_CODE:-STANDARD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4001/api/v1/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hislite-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        # SPA uses relative /api (proxied by edge nginx). Build arg reserved for future absolute URLs.
        VITE_API_URL: ${VITE_API_URL:-}
    image: hislite-web:prod
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - hislite-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - hislite-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    networks:
      - hislite-network
    profiles:
      - certs
    # One-off: docker compose --profile certs run --rm certbot certonly …
    # Renew:  ./infrastructure/scripts/renew-certs.sh

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hislite}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-hislite-documents}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-3}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    volumes:
      - ./infrastructure/scripts:/scripts:ro
      - backup_data:/backups
    entrypoint: /bin/sh -c
    command:
      - |
        apk add --no-cache gzip curl ca-certificates bash >/dev/null
        # MinIO client for document mirror
        curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
        chmod +x /usr/local/bin/mc /scripts/*.sh
        echo "$${BACKUP_CRON} /scripts/backup-run-all.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[backup] cron installed: $${BACKUP_CRON}"
        crond -f -l 8
    networks:
      - hislite-network
    profiles:
      - backup

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot-www:
  certbot-conf:
  backup_data:

networks:
  hislite-network:
    driver: bridge
    name: hislite-network
